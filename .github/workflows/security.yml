name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published without code changes, so also scan on a daily
  # schedule instead of only when a push or pull request happens to run
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for vulnerabilities
        uses: OWASP/cve-lite-cli@32c21bb9c73050bc177b563633b3fe684825517c # v1.28.0
        with:
          path: .
          fail-on: critical
          verbose: 'true'
          sarif: 'true'
          # Pinned because the scan gates merges; bump deliberately
          version: '1.27.0'

      # The CLI writes a timestamped SARIF file, anchors every result at
      # pnpm-lock.yaml line 1, and stamps per-CVE partialFingerprints that
      # differ between runs, so code scanning never matches alerts across
      # runs and reports everything as new. Copy to a stable filename and
      # point each finding at the lockfile line of its affected
      # package@version (the first token of the message). The upload action
      # then computes content-based fingerprints that are distinct per
      # finding and stable across runs, and alerts link to the actual
      # lockfile entry. Findings whose package cannot be located keep a
      # deterministic fingerprint as fallback so they never collapse into
      # one alert.
      - name: Normalize SARIF report
        id: sarif
        if: always()
        run: |
          file=$(ls -t cve-lite-scan-*.sarif 2>/dev/null | head -n 1 || true)
          if [[ -n "$file" ]]; then
            jq --rawfile lock pnpm-lock.yaml '
              ($lock | split("\n")) as $lines |
              .runs[]?.results[]? |= (
                ((.message.text // "") | split(" ") | first // "") as $pv |
                ([$lines | to_entries[]
                  | select($pv != "" and (.value
                      | sub("^ +"; "") | ltrimstr("\u0027")
                      | startswith($pv)))
                  | .key] | first) as $idx |
                if $idx != null then
                  (.locations[0].physicalLocation.region =
                    { startLine: ($idx + 1) })
                  | del(.partialFingerprints)
                else
                  .partialFingerprints =
                    { primaryLocationLineHash:
                        ((.ruleId // "unknown") + ":" + $pv) }
                end
              )' "$file" > cve-lite.sarif
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && steps.sarif.outputs.exists == 'true'
        with:
          sarif_file: cve-lite.sarif
