name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published without code changes, so also scan on a daily
  # schedule instead of only when a push or pull request happens to run
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan for vulnerabilities
        uses: OWASP/cve-lite-cli@631eac57629e8d37a6821da3269467fd9224c905 # v1.27.0
        with:
          path: .
          fail-on: critical
          verbose: 'true'
          sarif: 'true'
          # Pinned because the scan gates merges; bump deliberately
          version: '1.27.0'

      # The CLI writes a timestamped SARIF file and stamps its own per-CVE
      # partialFingerprints that differ between runs, so code scanning never
      # matches alerts across runs and reports everything as new. Copy to a
      # stable filename and rewrite each fingerprint to a deterministic value
      # derived from the rule ID and the affected package@version (the first
      # token of the message). Deleting the fingerprints instead would merge
      # same-CVE findings for different package versions, as all results share
      # the same lockfile location.
      - name: Normalize SARIF report
        id: sarif
        if: always()
        run: |
          file=$(ls -t cve-lite-scan-*.sarif 2>/dev/null | head -n 1 || true)
          if [[ -n "$file" ]]; then
            jq '.runs[]?.results[]? |= (.partialFingerprints = {primaryLocationLineHash: ((.ruleId // "unknown") + ":" + ((.message.text // "") | split(" ") | first))})' \
              "$file" > cve-lite.sarif
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always() && steps.sarif.outputs.exists == 'true'
        with:
          sarif_file: cve-lite.sarif
