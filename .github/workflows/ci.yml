name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Detect which parts of the monorepo a pull request touches, so that only
  # the affected jobs run. Each filter includes the paths of the workspace
  # packages it depends on. Pushes to main and workflow calls run everything.
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}
      methods: ${{ github.event_name != 'pull_request' || steps.filter.outputs.methods == 'true' }}
      solid: ${{ github.event_name != 'pull_request' || steps.filter.outputs.solid == 'true' }}
      solid_2: ${{ github.event_name != 'pull_request' || steps.filter.outputs.solid_2 == 'true' }}
      react: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react == 'true' }}
      preact: ${{ github.event_name != 'pull_request' || steps.filter.outputs.preact == 'true' }}
      qwik: ${{ github.event_name != 'pull_request' || steps.filter.outputs.qwik == 'true' }}
      svelte: ${{ github.event_name != 'pull_request' || steps.filter.outputs.svelte == 'true' }}
      vue: ${{ github.event_name != 'pull_request' || steps.filter.outputs.vue == 'true' }}
      angular: ${{ github.event_name != 'pull_request' || steps.filter.outputs.angular == 'true' }}
      react_native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react_native == 'true' }}
      website: ${{ github.event_name != 'pull_request' || steps.filter.outputs.website == 'true' }}
    steps:
      # For pull requests, the changed files are fetched from the GitHub API,
      # so no checkout is required
      - name: Filter changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.npmrc'
              - 'package.json'
              - 'patches/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'prettier.config.js'
              - 'packages/eslint-config/**'
            core: &core
              - *shared
              - 'packages/core/**'
            methods: &methods
              - *core
              - 'packages/methods/**'
            solid_2: &solid_2
              - *methods
              - 'frameworks/solid-2/**'
            solid:
              - *solid_2
              - 'frameworks/solid/**'
            react:
              - *methods
              - 'frameworks/react/**'
            preact:
              - *methods
              - 'frameworks/preact/**'
            qwik:
              - *methods
              - 'frameworks/qwik/**'
            svelte:
              - *methods
              - 'frameworks/svelte/**'
            vue:
              - *methods
              - 'frameworks/vue/**'
            angular:
              - *methods
              - 'frameworks/angular/**'
            react_native:
              - *methods
              - 'frameworks/react-native/**'
            website:
              - *shared
              - 'website/**'

  # packages/core
  core_prettier:
    name: Run Prettier in packages/core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup environment
        uses: $/.github/actions/environment
      - name: Prettier check
        run: pnpm format.check
        working-directory: packages/core

  core_eslint:
    name: Run ESLint in packages/core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
