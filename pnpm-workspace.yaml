packages:
  - 'frameworks/*'
  - 'packages/*'
  - 'playgrounds/*'
  - 'scripts'
  - 'website'
minimumReleaseAge: 10080  # minutes — 7 days
minimumReleaseAgeExclude:
  - valibot
  # Solid 2 release candidates for frameworks/solid-2 and playgrounds/solid-2
  - solid-js@2.0.0-rc.18
  - '@solidjs/signals@2.0.0-rc.18'
  - '@solidjs/web@2.0.0-rc.18'
  - '@solidjs/compiler@2.0.0-rc.18'
  - '@solidjs/compiler-darwin-arm64@2.0.0-rc.18'
  - '@solidjs/compiler-darwin-x64@2.0.0-rc.18'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.18'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0-rc.18'
  - '@solidjs/compiler-wasm32-wasi@2.0.0-rc.18'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0-rc.18'
  - '@solidjs/babel-plugin@2.0.0-rc.18'
  - '@solidjs/vite-plugin@3.0.0-next.51'
  - '@solidjs/testing-library@1.0.0-rc.2'
  - seroval@1.7.0
  - seroval-plugins@1.7.0
  - miniflare@4.20260603.0
  - wrangler@4.98.0
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  deasync: true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true
  vercel: true
  workerd: true
packageExtensions:
  # Imports vite without declaring it, which otherwise resolves to a hoisted
  # vite of another major instead of the one used by @qwik.dev/core
  '@qwik.dev/optimizer':
    peerDependencies:
      vite: '>=8 <9'
overrides:
  # Security: pin vulnerable deps to patched versions (CVE Lite findings).
  # Keyed by major so only the affected major line is moved to its fixed version.
  '@babel/core@7': '7.29.7'
  '@babel/plugin-transform-modules-systemjs@7': '7.29.4'
  '@expo/metro@56': '56.1.0'
